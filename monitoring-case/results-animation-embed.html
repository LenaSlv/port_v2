<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Open+Sans:wght@400&display=swap" rel="stylesheet"><link rel="stylesheet" href="./results-animation.css"><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101010}.prototype-viewport{position:absolute;width:1280px;height:832px;border-radius:0!important;transform-origin:0 0}</style><script src="./results-animation.js" defer></script></head><body><div class="prototype-viewport results-animation" role="img" aria-label="Демонстрация фильтров, результатов и управления версиями модели"><img class="animation-screen" src="./assets/results-screen.png" width="1280" height="832" alt=""><svg class="animation-cursor" viewBox="0 0 24 30" aria-hidden="true"><path d="M2 2v23l6-6 5 10 5-2-5-10h9Z" fill="#fff" stroke="#163240" stroke-width="1.8" stroke-linejoin="round"/></svg></div><script>
(() => {
  const canvas = document.querySelector('.prototype-viewport');
  function fitCanvas() {
    const scale = Math.min(innerWidth / 1280, innerHeight / 832);
    canvas.style.transform = 'scale(' + scale + ')';
    canvas.style.left = (innerWidth - 1280 * scale) / 2 + 'px';
    canvas.style.top = (innerHeight - 832 * scale) / 2 + 'px';
  }
  addEventListener('resize', fitCanvas);
  fitCanvas();
})();
</script></body></html>

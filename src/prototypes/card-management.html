<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>Сценарий управления транспортной картой</title>
  <link rel="stylesheet" href="../styles/prototype.css">
  <script defer src="../scripts/prototype.js"></script>
</head>
<body>
  <main class="stage">
    <a class="case-link" href="../../index.html#card">← К кейсу</a>
    <div class="prototype" data-view="home" aria-label="Интерактивный сценарий транспортного приложения">
      <div class="screen-rail">
        <section class="screen home-screen" aria-label="Главный экран">
          <img src="../assets/prototype/screen-home.png" alt="" draggable="false">
          <button class="hotspot all-cards" type="button" data-action="cards" aria-label="Все 4 карты"></button>
        </section>
        <section class="screen cards-screen" aria-label="Мои карты" aria-hidden="true" inert>
          <img src="../assets/prototype/screen-cards.png" alt="" draggable="false">
          <span class="selection-outline" aria-hidden="true"></span>
          <button class="hotspot cards-back" type="button" data-action="home" aria-label="Вернуться на главный экран"></button>
          <button class="hotspot primary-card" type="button" data-action="manage" aria-label="Открыть управление картой Моя карта 2000"></button>
        </section>
      </div>
      <button class="scrim" type="button" data-action="close" aria-label="Закрыть шторку" tabindex="-1"></button>
      <section class="sheet management-sheet" role="dialog" aria-modal="true" aria-label="Управление картой" aria-hidden="true" inert>
        <div class="sheet-art" aria-hidden="true"><img src="../assets/prototype/screen-management-v3.png" alt="" draggable="false"></div>
        <button class="hotspot management-back" type="button" data-action="close" aria-label="Вернуться к моим картам"></button>
        <button class="hotspot management-close" type="button" data-action="close" aria-label="Закрыть управление картой"></button>
        <button class="hotspot current-pass" type="button" data-action="pass" aria-label="Открыть текущий абонемент 60 поездок"></button>
        <div class="drag-handle" aria-hidden="true"></div>
      </section>
      <section class="sheet subscription-sheet" role="dialog" aria-modal="true" aria-label="Текущий абонемент" aria-hidden="true" inert>
        <div class="sheet-art" aria-hidden="true"><img src="../assets/prototype/screen-subscription.png" alt="" draggable="false"></div>
        <button class="hotspot subscription-close" type="button" data-action="close" aria-label="Вернуться к управлению картой"></button>
        <div class="drag-handle" aria-hidden="true"></div>
      </section>
    </div>
  </main>
</body>
</html>

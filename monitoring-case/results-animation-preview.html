<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Орбита · сохранённая анимация результатов</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Open+Sans:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./monitoring.css">
  <link rel="stylesheet" href="./results-animation.css">
  <script src="./results-animation.js" defer></script>
  <style>body{padding:32px}.animation-preview{max-width:1248px;margin:auto}.animation-preview h1{font-size:28px;line-height:1.3;margin-bottom:24px}.animation-preview .screen-figure{margin:0}</style>
</head>
<body>
  <main class="animation-preview">
    <h1>Анимация фильтров и результатов · Орбита</h1>
    <figure class="screen-figure overview-prototype" aria-labelledby="preview-caption">
      <div class="prototype-viewport results-animation" role="img" aria-label="Автоматическая демонстрация выбора фильтров, применения, прокрутки таблицы и отмены удаления версии модели.">
        <img class="animation-screen" src="./assets/results-screen.png" width="1280" height="832" alt="">
        <svg class="animation-cursor" viewBox="0 0 24 30" aria-hidden="true"><path d="M2 2v23l6-6 5 10 5-2-5-10h9Z" fill="#fff" stroke="#163240" stroke-width="1.8" stroke-linejoin="round"/></svg>
      </div>
      <figcaption id="preview-caption">Сохранённый сценарий для будущего блока. Исходные слои и тайминг находятся в <code>results-animation.js</code> и <code>results-animation.css</code>.</figcaption>
    </figure>
  </main>
</body>
</html>

<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Орбита · Добавить пользователя</title><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Montserrat,Arial,sans-serif;color:#242729}.backdrop{position:absolute;inset:0;background:linear-gradient(#07152199,#07152199),url('./assets/figma-administration.png') center/cover}.modal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(620px,92vw);height:min(690px,94vh);display:flex;flex-direction:column;background:#fff;border-radius:15px;overflow:hidden;box-shadow:0 18px 54px #0006;font-size:14px}.bar{height:48px;flex:none;background:#f1f4f7;border-radius:15px 15px 0 0;display:flex;align-items:center;justify-content:space-between;padding:8px 16px 8px 24px;font-weight:600}.bar button{border:0;background:transparent;font-size:20px;cursor:pointer}.content{position:relative;overflow:auto;padding:16px 20px;flex:1}.tabs{display:flex;gap:16px;margin-bottom:18px;border-bottom:1px solid #e4e7ec}.tab{border:0;background:transparent;padding:0 0 8px;color:#667085;font:inherit;cursor:pointer}.tab.active{color:#0f8075;font-weight:600;border-bottom:2px solid #0f8075}.pane[hidden],.menu[hidden]{display:none}.label{display:block;margin:10px 0 5px;color:#667085}.field{height:34px;border:1px solid #d3d4d4;border-radius:8px;padding:8px 12px;display:flex;align-items:center;justify-content:space-between;background:#fff;color:#344054}.group{font-weight:600;margin:18px 0 8px}.row{display:grid;grid-template-columns:1fr 1fr;gap:16px}.check{display:flex;align-items:center;gap:8px;margin:10px 0}.check input{accent-color:#0f8075}.menu{position:absolute;z-index:2;left:20px;right:20px;top:215px;max-height:220px;overflow:auto;padding:8px;background:#fff;border:1px solid #dbe5ed;border-radius:6px;box-shadow:0 8px 24px #0003}.menu button{display:flex;width:100%;height:30px;align-items:center;gap:8px;border:0;background:white;text-align:left;font:14px Montserrat;cursor:pointer}.menu button:hover{background:#f1f4f7}.actions{height:58px;flex:none;display:flex;justify-content:flex-end;align-items:center;padding:0 20px}.save{padding:9px 18px;border:0;border-radius:8px;background:#0f8075;color:#fff;font:500 14px Montserrat;cursor:pointer}.required{color:#d92d20}@media(max-width:540px){.modal{height:94vh}.row{grid-template-columns:1fr}}</style><link rel="stylesheet" href="./admin-prototype.css"></head>
<body><div class="backdrop"></div><div class="shade"><section class="modal" role="dialog" aria-modal="true" aria-label="Добавить пользователя"><header class="bar"><span>Добавить пользователя</span><button type="button" aria-label="Закрыть" data-close>×</button></header><main class="content"><div class="tabs"><button class="tab active" data-tab="personal">Личные данные</button><button class="tab" data-tab="access">Доступ в систему</button></div><section class="pane" data-pane="personal"><label class="label">Фамилия <span class="required">*</span></label><div class="field">Лебедева</div><label class="label">Имя <span class="required">*</span></label><div class="field">Людмила</div><label class="label">Отчество <span class="required">*</span></label><div class="field">Вячеславовна</div><p class="group">Контакты</p><div class="row"><div><label class="label">Электронная почта <span class="required">*</span></label><div class="field">example@com</div></div><div><label class="label">Телефон</label><div class="field">+7</div></div></div><p class="group">Работа</p><label class="label">Организация <span class="required">*</span></label><div class="field">ООО «Транспорт»　⌄</div><label class="label">Должность</label><div class="field">Введите текст</div></section><section class="pane" data-pane="access" hidden><p class="group">Вход в систему</p><label class="label">Логин <span class="required">*</span></label><div class="field">L.lebedeva <button type="button" aria-label="Показать пароль"><img src="./assets/eye.svg" alt=""></button></div><label class="label">Пароль <span class="required">*</span></label><div class="field">12345 <button type="button" aria-label="Показать пароль"><img src="./assets/eye.svg" alt=""></button></div><label class="check"><input type="checkbox"> Заблокировать доступ</label><p class="group">Права доступа</p><label class="check"><input type="checkbox" checked> Администратор</label><label class="check"><input type="checkbox"> Инженер</label><label class="check"><input type="checkbox"> Оператор</label><label class="check"><input type="checkbox" checked> Наблюдатель</label></section><div class="menu" hidden><button>□　Все организации</button><button>□　ООО «Транспорт»</button><button>□　ООО «Северный парк»</button><button>□　ООО «Городские маршруты»</button></div></main><footer class="actions"><button class="save">Сохранить</button></footer></section></div><script>const tabs=[...document.querySelectorAll('[data-tab]')];tabs.forEach(tab=>tab.addEventListener('click',()=>{tabs.forEach(item=>item.classList.toggle('active',item===tab));document.querySelectorAll('[data-pane]').forEach(pane=>pane.hidden=pane.dataset.pane!==tab.dataset.tab)}));document.querySelector('[data-close]').addEventListener('click',()=>document.querySelector('.modal').style.display='none');document.querySelector('.save').addEventListener('click',()=>document.querySelector('.modal').style.display='none');</script><script src="./admin-prototype.js"></script></body></html>

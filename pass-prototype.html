<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Выбор абонемента</title><link rel="stylesheet" href="pass-prototype.css"><script defer src="pass-prototype.js"></script></head>
<body>
  <main class="pass-demo" data-state="warning" aria-label="Автоматический сценарий выбора абонемента" inert>
    <img class="warning-screen" src="assets/pass-prototype/home.png" alt="Предупреждение: абонемент скоро закончится">
    <div class="topup-screen" aria-hidden="true">
      <img class="topup-art" src="assets/pass-prototype/topup.png" alt="Пополнить карту: выбор абонемента">
      <div class="list-viewport"><div class="list-content">
        <img class="list-art" src="assets/pass-prototype/topup.png" alt="">
        <div class="selected-pass"><img src="assets/pass-prototype/details.png" alt="60 поездок за 2200 рублей: срок, маршруты и условия возврата"></div>
      </div></div>
    </div>
  </main>
</body></html>
